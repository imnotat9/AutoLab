<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automaton Simulator (DFA, NFA, e-NFA)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- D3.js -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* D3 Canvas Styles */
        svg {
            cursor: default;
            user-select: none;
            background-color: #f8fafc;
        }
        
        /* Nodes */
        .node circle {
            fill: #ffffff;
            stroke: #1e293b;
            stroke-width: 2px;
            transition: fill 0.2s, stroke 0.2s, stroke-width 0.2s;
        }
        .node.selected circle {
            stroke: #0ea5e9;
            stroke-width: 3.5px;
        }
        .node.active circle.main-circle {
            fill: #bbf7d0;
            stroke: #166534;
        }
        .node.final circle.inner {
            stroke: #1e293b;
            stroke-width: 2px;
            fill: none;
            display: block;
        }
        .node.final.selected circle.inner {
            stroke: #0ea5e9;
        }
        .node.final.active circle.inner {
            stroke: #166534;
        }
        .node text {
            font-size: 14px;
            font-weight: 600;
            fill: #0f172a;
            pointer-events: none;
            text-anchor: middle;
            dominant-baseline: central;
        }
        
        /* Links */
        .link {
            fill: none;
            stroke: #475569;
            stroke-width: 2px;
            cursor: pointer;
            transition: stroke 0.2s, stroke-width 0.2s;
        }
        .link.selected {
            stroke: #0ea5e9;
            stroke-width: 3.5px;
        }
        .link-label {
            font-size: 14px;
            fill: #1e293b;
            font-weight: 700;
            pointer-events: none;
        }
        .link-label-bg {
            fill: #f8fafc;
            opacity: 0.9;
        }

        .dragline {
            fill: none;
            stroke: #94a3b8;
            stroke-width: 2px;
            stroke-dasharray: 5,5;
        }

        /* Selection Box (Rettangolo Azzurro) */
        .selection-box {
            fill: rgba(14, 165, 233, 0.15);
            stroke: rgba(14, 165, 233, 0.6);
            stroke-width: 1px;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col overflow-hidden text-slate-800">

    <!-- Header -->
    <header class="bg-slate-900 text-white px-6 py-3 flex justify-between items-center z-30 shadow-md">
        <h1 class="text-xl font-bold flex items-center gap-3">
            <img src="logo.png" alt="Logo" class="h-8 w-auto object-contain rounded">
            Finite State Automaton Simulator
        </h1>
        <div id="message-box" class="opacity-0 px-4 py-1.5 rounded bg-blue-500 text-white font-medium text-sm transition-opacity duration-300">
            <!-- Messaggi temporanei -->
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex flex-1 overflow-hidden relative">
        
        <!-- Sidebar SX: Controlli e Strumenti -->
        <aside id="sidebar-left" class="w-80 bg-white border-r border-gray-200 shadow-lg z-20 transition-[width] duration-300 relative flex flex-col shrink-0">
            <!-- Pulsante Toggle SX -->
            <button id="btn-toggle-left" class="absolute -right-8 top-1/2 transform -translate-y-1/2 bg-white border border-gray-200 border-l-0 rounded-r-md p-1.5 shadow-sm hover:bg-gray-50 z-30 flex items-center justify-center">
                <i id="icon-left" class="ph ph-caret-left text-lg"></i>
            </button>

            <!-- Wrapper per nascondere il contenuto in chiusura -->
            <div class="w-full flex-1 overflow-hidden relative">
                <!-- Contenuto a larghezza fissa -->
                <div class="w-80 h-full overflow-y-auto flex flex-col absolute top-0 left-0">
                    <!-- Strumenti -->
                    <div class="p-5 border-b border-gray-100">
                        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Drawing Tools</h2>
                        <div class="flex gap-2 mb-2">
                            <button id="btn-mode-select" class="flex-1 py-2 px-3 rounded-md bg-blue-50 text-blue-700 border border-blue-200 font-semibold text-sm flex items-center justify-center gap-1 transition-colors">
                                <i class="ph ph-cursor-click"></i> Select
                            </button>
                        </div>
                        <div class="flex gap-2">
                            <button id="btn-mode-node" class="flex-1 py-2 px-3 rounded-md bg-white text-slate-600 border border-slate-300 hover:bg-slate-50 font-semibold text-sm flex items-center justify-center gap-1 transition-colors">
                                <i class="ph ph-circle-plus"></i> State
                            </button>
                            <button id="btn-mode-link" class="flex-1 py-2 px-3 rounded-md bg-white text-slate-600 border border-slate-300 hover:bg-slate-50 font-semibold text-sm flex items-center justify-center gap-1 transition-colors">
                                <i class="ph ph-arrow-right"></i> Transition
                            </button>
                        </div>
                        <p class="text-[11px] text-slate-500 mt-3 leading-tight" id="mode-hint">
                            Selection mode: click to select, drag to move. Use Del/Backspace to delete.
                        </p>
                    </div>

                    <!-- Proprietà -->
                    <div class="p-5 border-b border-gray-100 flex-1">
                        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Selection Properties</h2>
                        <div id="panel-empty" class="text-sm text-slate-400 italic text-center py-4">No element selected.</div>
                        
                        <!-- Proprietà Multipla -->
                        <div id="panel-multi" class="hidden flex flex-col gap-4 text-center py-4">
                            <span class="text-sm text-slate-600 font-semibold" id="multi-count">Multiple elements selected</span>
                            <button id="btn-delete-multi" class="w-full py-2 bg-red-50 text-red-600 border border-red-200 hover:bg-red-100 rounded text-sm font-semibold flex items-center justify-center gap-1 mt-1 transition-colors">
                                <i class="ph ph-trash"></i> Delete Selected (Del)
                            </button>
                        </div>

                        <!-- Proprietà Stato Singolo -->
                        <div id="panel-node" class="hidden flex flex-col gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">State Name</label>
                                <input type="text" id="prop-node-name" class="w-full border border-slate-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                            </div>
                            <div class="flex flex-col gap-2">
                                <label class="flex items-center gap-2 cursor-pointer">
                                    <input type="checkbox" id="prop-node-start" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                                    <span class="text-sm text-slate-700 font-medium">Start State</span>
                                </label>
                                <label class="flex items-center gap-2 cursor-pointer">
                                    <input type="checkbox" id="prop-node-final" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                                    <span class="text-sm text-slate-700 font-medium">Final State</span>
                                </label>
                            </div>
                            <button id="btn-delete-node" class="text-sm text-red-600 hover:text-red-800 text-left font-semibold flex items-center gap-1 mt-1">
                                <i class="ph ph-trash"></i> Delete State (Del)
                            </button>
                        </div>

                        <!-- Proprietà Collegamento Singolo -->
                        <div id="panel-link" class="hidden flex flex-col gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Transition Symbols (e.g. a, b)</label>
                                <div class="flex gap-2">
                                    <input type="text" id="prop-link-label" class="flex-1 border border-slate-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                                    <button id="btn-add-epsilon-panel" class="px-3 py-1.5 bg-slate-100 border border-slate-300 rounded text-sm hover:bg-slate-200 font-medium" title="Add Epsilon">ε</button>
                                </div>
                            </div>
                            <button id="btn-delete-link" class="text-sm text-red-600 hover:text-red-800 text-left font-semibold flex items-center gap-1 mt-1">
                                <i class="ph ph-trash"></i> Delete Transition (Del)
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Area di Disegno Centrale -->
        <main class="flex-1 relative z-10" id="canvas-container">
            <!-- SVG init via D3 -->
        </main>

        <!-- Sidebar DX: Simulazione -->
        <aside id="sidebar-right" class="w-80 bg-slate-50 border-l border-gray-200 shadow-lg z-20 transition-[width] duration-300 relative flex flex-col shrink-0">
            <!-- Pulsante Toggle DX -->
            <button id="btn-toggle-right" class="absolute -left-8 top-1/2 transform -translate-y-1/2 bg-white border border-gray-200 border-r-0 rounded-l-md p-1.5 shadow-sm hover:bg-gray-50 z-30 flex items-center justify-center">
                <i id="icon-right" class="ph ph-caret-right text-lg"></i>
            </button>

            <!-- Wrapper per nascondere il contenuto in chiusura -->
            <div class="w-full flex-1 overflow-hidden relative">
                <!-- Contenuto a larghezza fissa -->
                <div class="w-80 h-full flex flex-col p-5 absolute top-0 right-0">
                    <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Simulation</h2>
                    
                    <div class="mb-3 shrink-0">
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Alphabet (optional, e.g. a,b)</label>
                        <input type="text" id="sim-alphabet" class="w-full border border-slate-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-blue-500" placeholder="Leave empty for free input">
                    </div>

                    <div class="mb-4 shrink-0">
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Input String</label>
                        <input type="text" id="sim-input" class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500 font-mono" placeholder="Enter string...">
                    </div>

                    <div class="flex flex-col gap-2 mb-4 shrink-0">
                        <button id="btn-sim-quick" class="w-full py-2 bg-blue-600 text-white rounded font-semibold text-sm hover:bg-blue-700 transition flex justify-center items-center gap-2">
                            <i class="ph ph-lightning"></i> Quick Simulation
                        </button>
                        <div class="flex gap-2">
                            <button id="btn-sim-start-step" class="flex-1 py-2 bg-slate-800 text-white rounded font-semibold text-sm hover:bg-slate-900 transition flex justify-center items-center gap-1">
                                <i class="ph ph-play"></i> Step by Step
                            </button>
                            <button id="btn-sim-stop" class="hidden flex-1 py-2 bg-red-100 text-red-700 border border-red-200 rounded font-semibold text-sm hover:bg-red-200 transition flex justify-center items-center gap-1">
                                <i class="ph ph-stop"></i> Stop
                            </button>
                        </div>
                        <button id="btn-sim-next" class="hidden w-full py-2 bg-green-100 text-green-800 border border-green-300 rounded font-bold text-sm hover:bg-green-200 transition flex justify-center items-center gap-1">
                            Next Step <i class="ph ph-arrow-right-bold"></i>
                        </button>
                    </div>

                    <!-- Log Simulazione (Autoscroll) -->
                    <div id="sim-status" class="bg-white border border-slate-200 rounded p-3 text-sm flex-1 overflow-y-auto font-mono shadow-inner">
                        <span class="text-slate-400 italic">Waiting for input...</span>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <!-- Modale Transizione -->
    <div id="modal-transition" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl w-80 overflow-hidden transform transition-all">
            <div class="px-5 py-4 border-b border-slate-100">
                <h3 class="text-lg font-bold text-slate-800">New Transition</h3>
                <p class="text-xs text-slate-500 mt-1">Enter comma-separated symbols.</p>
            </div>
            <div class="p-5">
                <input type="text" id="modal-input" class="w-full border border-slate-300 rounded px-3 py-2 text-base focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-shadow mb-3" placeholder="e.g. a, b" autocomplete="off">
                <div class="flex gap-2">
                    <button id="modal-btn-epsilon" class="py-1 px-3 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded text-sm font-semibold border border-slate-200">
                        Insert Epsilon (ε)
                    </button>
                </div>
            </div>
            <div class="bg-slate-50 px-5 py-3 flex justify-end gap-2 border-t border-slate-100">
                <button id="modal-btn-cancel" class="px-4 py-2 text-slate-600 hover:bg-slate-200 rounded font-semibold text-sm transition-colors">Cancel</button>
                <button id="modal-btn-ok" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded font-semibold text-sm transition-colors">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Logica Applicazione -->
    <script>
        // --- Gestione Pannelli Laterali (Toggle) ---
        const sidebarLeft = document.getElementById('sidebar-left');
        const iconLeft = document.getElementById('icon-left');
        document.getElementById('btn-toggle-left').addEventListener('click', () => {
            if(sidebarLeft.classList.contains('w-80')) {
                sidebarLeft.classList.replace('w-80', 'w-0');
                iconLeft.classList.replace('ph-caret-left', 'ph-caret-right');
            } else {
                sidebarLeft.classList.replace('w-0', 'w-80');
                iconLeft.classList.replace('ph-caret-right', 'ph-caret-left');
            }
        });

        const sidebarRight = document.getElementById('sidebar-right');
        const iconRight = document.getElementById('icon-right');
        document.getElementById('btn-toggle-right').addEventListener('click', () => {
            if(sidebarRight.classList.contains('w-80')) {
                sidebarRight.classList.replace('w-80', 'w-0');
                iconRight.classList.replace('ph-caret-right', 'ph-caret-left');
            } else {
                sidebarRight.classList.replace('w-0', 'w-80');
                iconRight.classList.replace('ph-caret-left', 'ph-caret-right');
            }
        });

        // --- Costanti e Stato Globale ---
        const EPSILON = 'ε';
        const NODE_RADIUS = 26;

        let nodes = [];
        let links = [];
        let nodeIdCounter = 0;
        
        let mode = 'select';
        
        // Selezione Multipla
        let selectedNodes = new Set();
        let selectedLinks = new Set();
        
        // Drag Box
        let isSelecting = false;
        let selectionBox = { x1: 0, y1: 0, x2: 0, y2: 0 };
        
        // Stato Simulazione
        let isSimulating = false;
        let simString = "";
        let simIndex = 0;
        let activeStates = new Set();
        
        // --- Setup D3.js ---
        const container = document.getElementById('canvas-container');
        const svg = d3.select("#canvas-container").append("svg")
            .attr("width", "100%")
            .attr("height", "100%")
            .on("mousedown", handleSvgMouseDown)
            .on("mousemove", handleSvgMouseMove)
            .on("mouseup", handleSvgMouseUp)
            .on("mouseleave", handleSvgMouseUp)
            .on("click", handleSvgClick);

        const defs = svg.append("defs");
        
        defs.append("marker")
            .attr("id", "arrowhead")
            .attr("viewBox", "-0 -5 10 10")
            .attr("refX", NODE_RADIUS + 7)
            .attr("refY", 0)
            .attr("orient", "auto")
            .attr("markerWidth", 7)
            .attr("markerHeight", 7)
            .attr("xoverflow", "visible")
            .append("svg:path")
            .attr("d", "M 0,-5 L 10 ,0 L 0,5")
            .attr("fill", "#475569")
            .style("stroke", "none");

        defs.append("marker")
            .attr("id", "arrowhead-selected")
            .attr("viewBox", "-0 -5 10 10")
            .attr("refX", NODE_RADIUS + 7)
            .attr("refY", 0)
            .attr("orient", "auto")
            .attr("markerWidth", 7)
            .attr("markerHeight", 7)
            .attr("xoverflow", "visible")
            .append("svg:path")
            .attr("d", "M 0,-5 L 10 ,0 L 0,5")
            .attr("fill", "#0ea5e9")
            .style("stroke", "none");

        const linkGroup = svg.append("g").attr("class", "links");
        const nodeGroup = svg.append("g").attr("class", "nodes");
        
        let dragLine = svg.append("path").attr("class", "dragline hidden").attr("d", "M0,0L0,0");
        let selectionRect = svg.append("rect").attr("class", "selection-box hidden");
        let mousedownNode = null;

        // --- Gestione Selezione Rettangolare (Corretta) ---
        function handleSvgMouseDown(event) {
            if (isSimulating || mode !== 'select' || event.target.tagName !== 'svg') return;
            
            let p = d3.pointer(event, svg.node());
            isSelecting = true;
            selectionBox.x1 = p[0];
            selectionBox.y1 = p[1];
            selectionBox.x2 = p[0];
            selectionBox.y2 = p[1];
            
            if (!event.shiftKey) {
                clearSelection();
            }
            
            selectionRect
                .attr("x", p[0]).attr("y", p[1])
                .attr("width", 0).attr("height", 0)
                .classed("hidden", false);
        }

        function handleSvgMouseMove(event) {
            if (isSelecting) {
                let p = d3.pointer(event, svg.node());
                selectionBox.x2 = p[0];
                selectionBox.y2 = p[1];
                
                let minX = Math.min(selectionBox.x1, selectionBox.x2);
                let maxX = Math.max(selectionBox.x1, selectionBox.x2);
                let minY = Math.min(selectionBox.y1, selectionBox.y2);
                let maxY = Math.max(selectionBox.y1, selectionBox.y2);

                selectionRect
                    .attr("x", minX).attr("y", minY)
                    .attr("width", maxX - minX).attr("height", maxY - minY);
            }
        }

        function handleSvgMouseUp(event) {
            if (isSelecting) {
                isSelecting = false;
                selectionRect.classed("hidden", true);
                
                let minX = Math.min(selectionBox.x1, selectionBox.x2);
                let maxX = Math.max(selectionBox.x1, selectionBox.x2);
                let minY = Math.min(selectionBox.y1, selectionBox.y2);
                let maxY = Math.max(selectionBox.y1, selectionBox.y2);
                
                if (maxX - minX > 5 || maxY - minY > 5) {
                    nodes.forEach(n => {
                        if (n.x >= minX && n.x <= maxX && n.y >= minY && n.y <= maxY) {
                            selectedNodes.add(n);
                        }
                    });
                    
                    links.forEach(l => {
                        if (selectedNodes.has(l.source) && selectedNodes.has(l.target)) {
                            selectedLinks.add(l);
                        }
                    });
                    
                    updateGraph();
                }
            }
        }

        // --- Aggiornamento Grafica (D3) ---
        function updateGraph() {
            let linkElements = linkGroup.selectAll("g.link-group")
                .data(links, d => d.source.id + "-" + d.target.id);

            linkElements.exit().remove();

            let linkEnter = linkElements.enter().append("g")
                .attr("class", "link-group");

            linkEnter.append("path")
                .attr("class", "link")
                .attr("marker-end", "url(#arrowhead)")
                .on("click", (event, d) => {
                    if (mode === 'select' && !isSimulating) {
                        if (!event.shiftKey) clearSelection();
                        selectedLinks.add(d);
                        updateGraph();
                        event.stopPropagation();
                    }
                });

            linkEnter.append("text")
                .attr("class", "link-label-bg")
                .attr("text-anchor", "middle")
                .attr("dy", -6)
                .attr("stroke", "#f8fafc")
                .attr("stroke-width", 5)
                .attr("stroke-linejoin", "round");
                
            linkEnter.append("text")
                .attr("class", "link-label")
                .attr("text-anchor", "middle")
                .attr("dy", -6);

            linkElements = linkEnter.merge(linkElements);

            linkElements.select("path")
                .classed("selected", d => selectedLinks.has(d))
                .attr("marker-end", d => selectedLinks.has(d) ? "url(#arrowhead-selected)" : "url(#arrowhead)")
                .attr("d", calculateLinkPath);

            linkElements.select(".link-label")
                .text(d => d.label)
                .attr("x", d => getLabelPosition(d).x)
                .attr("y", d => getLabelPosition(d).y);
                
            linkElements.select(".link-label-bg")
                .text(d => d.label)
                .attr("x", d => getLabelPosition(d).x)
                .attr("y", d => getLabelPosition(d).y);

            let nodeElements = nodeGroup.selectAll("g.node")
                .data(nodes, d => d.id);

            nodeElements.exit().remove();

            let nodeEnter = nodeElements.enter().append("g")
                .attr("class", "node")
                .call(d3.drag()
                    .on("start", dragstarted)
                    .on("drag", dragged)
                    .on("end", dragended))
                .on("click", (event, d) => {
                    if (isSimulating) return;
                    if (mode === 'select') {
                        if (!event.shiftKey && !selectedNodes.has(d)) clearSelection();
                        selectedNodes.add(d);
                        updateGraph();
                    }
                    event.stopPropagation();
                });

            nodeEnter.append("path")
                .attr("class", "start-arrow")
                .attr("d", `M ${-NODE_RADIUS - 35} 0 L ${-NODE_RADIUS - 2} 0 M ${-NODE_RADIUS - 12} -6 L ${-NODE_RADIUS - 2} 0 L ${-NODE_RADIUS - 12} 6`)
                .attr("stroke", "#1e293b")
                .attr("stroke-width", 2.5)
                .attr("fill", "none")
                .attr("stroke-linejoin", "round")
                .attr("stroke-linecap", "round");

            nodeEnter.append("circle")
                .attr("class", "main-circle")
                .attr("r", NODE_RADIUS);
            
            nodeEnter.append("circle")
                .attr("class", "inner hidden")
                .attr("r", NODE_RADIUS - 6);

            nodeEnter.append("text")
                .text(d => d.name);

            nodeElements = nodeEnter.merge(nodeElements);

            nodeElements.attr("transform", d => `translate(${d.x},${d.y})`);
            
            nodeElements.classed("selected", d => selectedNodes.has(d));
            nodeElements.classed("active", d => activeStates.has(d.id));
            nodeElements.classed("final", d => d.isFinal);
            
            nodeElements.select(".start-arrow").style("display", d => d.isStart ? "block" : "none");
            nodeElements.select(".inner").classed("hidden", d => !d.isFinal);
            nodeElements.select("text").text(d => d.name);

            updateSidebar();
        }

        // --- Calcolo Posizioni e Curve ---
        function calculateLinkPath(d) {
            if (d.source === d.target) {
                let x = d.source.x;
                let y = d.source.y;
                return `M ${x - 8},${y - NODE_RADIUS + 2} C ${x - 30},${y - NODE_RADIUS - 40} ${x + 30},${y - NODE_RADIUS - 40} ${x + 8},${y - NODE_RADIUS + 2}`;
            }
            let bidirectional = links.find(l => l.source === d.target && l.target === d.source);
            if (bidirectional) {
                let dx = d.target.x - d.source.x;
                let dy = d.target.y - d.source.y;
                let dr = Math.sqrt(dx * dx + dy * dy) * 1.5;
                return `M ${d.source.x},${d.source.y} A ${dr},${dr} 0 0,1 ${d.target.x},${d.target.y}`;
            } else {
                return `M ${d.source.x},${d.source.y} L ${d.target.x},${d.target.y}`;
            }
        }

        function getLabelPosition(d) {
            if (d.source === d.target) {
                return { x: d.source.x, y: d.source.y - NODE_RADIUS - 30 };
            }
            let bidirectional = links.find(l => l.source === d.target && l.target === d.source);
            if (bidirectional) {
                let dx = d.target.x - d.source.x;
                let dy = d.target.y - d.source.y;
                let dr = Math.sqrt(dx * dx + dy * dy);
                let offsetX = (dx / 2) - (dy / dr) * 20;
                let offsetY = (dy / 2) + (dx / dr) * 20;
                return { x: d.source.x + offsetX, y: d.source.y + offsetY };
            } else {
                return { x: (d.source.x + d.target.x) / 2, y: (d.source.y + d.target.y) / 2 };
            }
        }

        // --- Logica Eventi Mouse / Drag sui nodi ---
        function dragstarted(event, d) {
            if (isSimulating) return;
            if (mode === 'select') {
                if (!selectedNodes.has(d)) {
                    if (!event.sourceEvent.shiftKey) clearSelection();
                    selectedNodes.add(d);
                    updateGraph();
                }
                d3.select(this).raise();
            } else if (mode === 'link') {
                mousedownNode = d;
                dragLine.classed("hidden", false)
                    .attr("d", `M${d.x},${d.y}L${d.x},${d.y}`);
            }
        }

        function dragged(event, d) {
            if (isSimulating) return;
            if (mode === 'select') {
                selectedNodes.forEach(node => {
                    node.x += event.dx;
                    node.y += event.dy;
                });
                updateGraph();
            } else if (mode === 'link' && mousedownNode) {
                let p = d3.pointer(event, container);
                dragLine.attr("d", `M${mousedownNode.x},${mousedownNode.y}L${p[0]},${p[1]}`);
            }
        }

        function dragended(event, d) {
            if (isSimulating) return;
            if (mode === 'link' && mousedownNode) {
                dragLine.classed("hidden", true);
                let p = d3.pointer(event, container);
                let targetNode = nodes.find(n => {
                    let dx = n.x - p[0];
                    let dy = n.y - p[1];
                    return (dx * dx + dy * dy) < (NODE_RADIUS * NODE_RADIUS * 3); 
                });
                
                if (targetNode) {
                    promptForTransition(mousedownNode, targetNode);
                }
                mousedownNode = null;
            }
        }

        function handleSvgClick(event) {
            if (isSimulating) return;
            if (isSelecting) return;
            
            if (mode === 'node' && event.target.tagName === 'svg') {
                let p = d3.pointer(event);
                addNode(p[0], p[1]);
            } else if (mode === 'select' && event.target.tagName === 'svg') {
                clearSelection();
                updateGraph();
            }
        }

        // --- Gestione Dati & Operazioni (Corretta) ---
        function addNode(x, y) {
            let isFirst = nodes.length === 0;
            let node = {
                id: "q" + nodeIdCounter,
                name: "q" + nodeIdCounter,
                isStart: isFirst,
                isFinal: false,
                x: x,
                y: y
            };
            nodeIdCounter++;
            nodes.push(node);
            clearSelection();
            selectedNodes.add(node);
            setMode('select');
            updateGraph(); // Aggiornamento UI inserito correttamente
        }

        let pendingLink = null;
        const modal = document.getElementById('modal-transition');
        const modalInput = document.getElementById('modal-input');

        function promptForTransition(source, target) {
            let existing = links.find(l => l.source === source && l.target === target);
            if (existing) {
                clearSelection();
                selectedLinks.add(existing);
                updateGraph();
                return;
            }
            pendingLink = { source, target };
            modalInput.value = '';
            modal.classList.remove('hidden');
            setTimeout(() => modalInput.focus(), 50);
        }

        document.getElementById('modal-btn-cancel').addEventListener('click', () => {
            modal.classList.add('hidden');
            pendingLink = null;
        });

        document.getElementById('modal-btn-epsilon').addEventListener('click', () => {
            modalInput.value = modalInput.value ? modalInput.value + ',' + EPSILON : EPSILON;
            modalInput.focus();
        });

        document.getElementById('modal-btn-ok').addEventListener('click', finalizeTransition);
        modalInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') finalizeTransition();
            if (e.key === 'Escape') {
                modal.classList.add('hidden');
                pendingLink = null;
            }
        });

        function finalizeTransition() {
            if (!pendingLink) return;
            let val = modalInput.value.replace(/\s+/g, '');
            if (!val) {
                showMessage("Enter at least one symbol (or Epsilon).", "error");
                return;
            }
            let link = { source: pendingLink.source, target: pendingLink.target, label: val };
            links.push(link);
            modal.classList.add('hidden');
            pendingLink = null;
            
            clearSelection();
            selectedLinks.add(link);
            setMode('select'); 
        }

        function clearSelection() {
            selectedNodes.clear();
            selectedLinks.clear();
        }

        function deleteSelected() {
            if (isSimulating) return;
            
            let elementsDeleted = 0;
            
            if (selectedNodes.size > 0) {
                links = links.filter(l => !selectedNodes.has(l.source) && !selectedNodes.has(l.target));
                nodes = nodes.filter(n => !selectedNodes.has(n));
                
                if (!nodes.some(n => n.isStart) && nodes.length > 0) {
                    nodes[0].isStart = true;
                }
                elementsDeleted += selectedNodes.size;
                selectedNodes.clear();
            }
            
            if (selectedLinks.size > 0) {
                links = links.filter(l => !selectedLinks.has(l));
                elementsDeleted += selectedLinks.size;
                selectedLinks.clear();
            }

            if (elementsDeleted > 0) {
                updateGraph();
                showMessage(`${elementsDeleted} element(s) deleted.`);
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (!modal.classList.contains('hidden')) return;
            if (e.key === 'Delete' || e.key === 'Backspace') deleteSelected();
        });

        // --- Aggiornamento UI Pannello Laterale ---
        function updateSidebar() {
            let totalSelected = selectedNodes.size + selectedLinks.size;
            
            document.getElementById('panel-empty').classList.add('hidden');
            document.getElementById('panel-multi').classList.add('hidden');
            document.getElementById('panel-node').classList.add('hidden');
            document.getElementById('panel-link').classList.add('hidden');

            if (totalSelected === 0) {
                document.getElementById('panel-empty').classList.remove('hidden');
            } else if (totalSelected > 1) {
                document.getElementById('panel-multi').classList.remove('hidden');
                document.getElementById('multi-count').innerText = `${totalSelected} elements selected`;
            } else if (selectedNodes.size === 1) {
                document.getElementById('panel-node').classList.remove('hidden');
                let node = Array.from(selectedNodes)[0];
                document.getElementById('prop-node-name').value = node.name;
                document.getElementById('prop-node-start').checked = node.isStart;
                document.getElementById('prop-node-final').checked = node.isFinal;
            } else if (selectedLinks.size === 1) {
                document.getElementById('panel-link').classList.remove('hidden');
                let link = Array.from(selectedLinks)[0];
                document.getElementById('prop-link-label').value = link.label;
            }
        }

        // Ascoltatori Sidebar Singola Modifica
        document.getElementById('prop-node-name').addEventListener('input', (e) => {
            if (selectedNodes.size === 1) { 
                Array.from(selectedNodes)[0].name = e.target.value; updateGraph(); 
            }
        });
        document.getElementById('prop-node-start').addEventListener('change', (e) => {
            if (selectedNodes.size === 1) {
                let node = Array.from(selectedNodes)[0];
                if (e.target.checked) {
                    nodes.forEach(n => n.isStart = false); 
                    node.isStart = true;
                    updateGraph();
                } else if (!e.target.checked) {
                    e.target.checked = true; 
                    showMessage("An initial state must exist.", "error");
                }
            }
        });
        document.getElementById('prop-node-final').addEventListener('change', (e) => {
            if (selectedNodes.size === 1) { 
                Array.from(selectedNodes)[0].isFinal = e.target.checked; updateGraph(); 
            }
        });

        document.getElementById('prop-link-label').addEventListener('input', (e) => {
            if (selectedLinks.size === 1) { 
                let val = e.target.value.replace(/\s+/g, '');
                Array.from(selectedLinks)[0].label = val; 
                updateGraph(); 
            }
        });
        document.getElementById('btn-add-epsilon-panel').addEventListener('click', () => {
            if (selectedLinks.size === 1) {
                let link = Array.from(selectedLinks)[0];
                let input = document.getElementById('prop-link-label');
                let val = input.value;
                val = val ? val + "," + EPSILON : EPSILON;
                link.label = val;
                input.value = val;
                updateGraph();
            }
        });
        
        document.getElementById('btn-delete-node').addEventListener('click', deleteSelected);
        document.getElementById('btn-delete-link').addEventListener('click', deleteSelected);
        document.getElementById('btn-delete-multi').addEventListener('click', deleteSelected);

        // --- Gestione Modalità ---
        function setMode(newMode) {
            if (isSimulating) return;
            mode = newMode;
            
            document.querySelectorAll('button[id^="btn-mode-"]').forEach(btn => {
                btn.classList.remove('bg-blue-50', 'text-blue-700', 'border-blue-200');
                btn.classList.add('bg-white', 'text-slate-600', 'border-slate-300');
            });
            let activeBtn = document.getElementById(`btn-mode-${mode}`);
            activeBtn.classList.remove('bg-white', 'text-slate-600', 'border-slate-300');
            activeBtn.classList.add('bg-blue-50', 'text-blue-700', 'border-blue-200');

            let hint = "";
            if (mode === 'select') hint = "Drag on the background to select multiple elements. Hold Shift to add to selection.";
            else if (mode === 'node') hint = "Click on the workspace to create a new state.";
            else if (mode === 'link') hint = "Drag from one state to another to create a transition.";
            document.getElementById('mode-hint').innerText = hint;
            
            svg.style("cursor", mode === 'node' ? 'crosshair' : 'default');
        }

        document.getElementById('btn-mode-select').addEventListener('click', () => setMode('select'));
        document.getElementById('btn-mode-node').addEventListener('click', () => setMode('node'));
        document.getElementById('btn-mode-link').addEventListener('click', () => setMode('link'));

        // --- Logica Simulazione ---
        function getStartNode() {
            return nodes.find(n => n.isStart);
        }

        function eClosure(stateIds) {
            let closure = new Set(stateIds);
            let stack = Array.from(stateIds);
            
            while(stack.length > 0) {
                let currentId = stack.pop();
                let outgoingLinks = links.filter(l => l.source.id === currentId);
                
                for(let link of outgoingLinks) {
                    let symbols = link.label.split(',').map(s => s.trim());
                    if (symbols.includes(EPSILON)) {
                        if (!closure.has(link.target.id)) {
                            closure.add(link.target.id);
                            stack.push(link.target.id);
                        }
                    }
                }
            }
            return closure;
        }

        function move(stateIds, symbol) {
            let nextStates = new Set();
            for(let id of stateIds) {
                let outgoingLinks = links.filter(l => l.source.id === id);
                for(let link of outgoingLinks) {
                    let symbols = link.label.split(',').map(s => s.trim());
                    if (symbols.includes(symbol)) {
                        nextStates.add(link.target.id);
                    }
                }
            }
            return nextStates;
        }

        function appendSimLog(text, type="normal") {
            const logDiv = document.getElementById('sim-status');
            const p = document.createElement('div');
            let colorClass = "text-slate-700";
            if (type === 'success') colorClass = "text-green-700 font-bold bg-green-50 p-1 rounded mt-2 border border-green-200";
            if (type === 'error') colorClass = "text-red-700 font-bold bg-red-50 p-1 rounded mt-2 border border-red-200";
            if (type === 'info') colorClass = "text-blue-700 font-semibold";
            
            p.className = `mb-1 ${colorClass}`;
            p.innerHTML = text;
            logDiv.appendChild(p);
            logDiv.scrollTop = logDiv.scrollHeight; 
        }
        
        function clearSimLog() {
            document.getElementById('sim-status').innerHTML = '';
        }

        function checkAcceptance() {
            for(let id of activeStates) {
                let n = nodes.find(x => x.id === id);
                if (n && n.isFinal) return true;
            }
            return false;
        }

        function validateInputAlphabet(inputStr) {
            let alphaStr = document.getElementById('sim-alphabet').value.replace(/\s+/g, '');
            if (!alphaStr) return true; 
            let alphabet = alphaStr.split(',');
            for (let char of inputStr) {
                if (!alphabet.includes(char)) {
                    showMessage(`Symbol '${char}' is not in the alphabet.`, "error");
                    return false;
                }
            }
            return true;
        }

        // Simulazione Completa
        document.getElementById('btn-sim-quick').addEventListener('click', () => {
            if(nodes.length === 0) return showMessage("The automaton is empty.", "error");
            let startNode = getStartNode();
            if (!startNode) return showMessage("Missing start state.", "error");

            let inputStr = document.getElementById('sim-input').value;
            if (!validateInputAlphabet(inputStr)) return;

            clearSimLog();
            appendSimLog(`Quick test: <b>"${inputStr || 'ε'}"</b>`, "info");
            
            activeStates = eClosure(new Set([startNode.id]));
            
            for(let i = 0; i < inputStr.length; i++) {
                let char = inputStr[i];
                let next = move(activeStates, char);
                activeStates = eClosure(next);
                if (activeStates.size === 0) break; 
            }
            
            updateGraph();
            
            if (checkAcceptance()) {
                appendSimLog("Result: String ACCEPTED.", "success");
            } else {
                appendSimLog("Result: String REJECTED.", "error");
            }
            
            setTimeout(() => {
                if(!isSimulating) {
                    activeStates.clear();
                    updateGraph();
                }
            }, 2500);
        });

        // Simulazione Step-by-Step
        document.getElementById('btn-sim-start-step').addEventListener('click', () => {
            if(nodes.length === 0) return showMessage("The automaton is empty.", "error");
            let startNode = getStartNode();
            if (!startNode) return showMessage("Missing start state.", "error");

            let inputStr = document.getElementById('sim-input').value;
            if (!validateInputAlphabet(inputStr)) return;

            isSimulating = true;
            simString = inputStr;
            simIndex = 0;
            
            clearSelection();
            setMode('select'); 

            document.getElementById('btn-sim-start-step').classList.add('hidden');
            document.getElementById('btn-sim-quick').classList.add('hidden');
            document.getElementById('btn-sim-stop').classList.remove('hidden');
            document.getElementById('btn-sim-next').classList.remove('hidden');
            document.getElementById('btn-sim-next').disabled = false;
            document.getElementById('btn-sim-next').classList.remove('opacity-50');

            clearSimLog();
            appendSimLog(`Starting Step-by-Step. Input: <b>"${simString || 'ε'}"</b>`, "info");
            
            activeStates = eClosure(new Set([startNode.id]));
            
            let stateNames = Array.from(activeStates).map(id => nodes.find(n=>n.id===id).name).join(', ');
            appendSimLog(`Initialization (with e-closure): States { ${stateNames} }`);
            updateGraph();
            
            if (simString.length === 0) evaluteFinalStep();
        });

        document.getElementById('btn-sim-next').addEventListener('click', () => {
            if (!isSimulating) return;

            let char = simString[simIndex];
            appendSimLog(`Reading symbol: <b>'${char}'</b>`);
            
            let moved = move(activeStates, char);
            activeStates = eClosure(moved);
            
            if (activeStates.size === 0) {
                appendSimLog(`No valid transition. Automaton blocked (trap state).`, "error");
                evaluteFinalStep();
                updateGraph();
                return;
            } 
            
            let stateNames = Array.from(activeStates).map(id => nodes.find(n=>n.id===id).name).join(', ');
            appendSimLog(`New active states: { ${stateNames} }`);
            
            simIndex++;
            updateGraph();

            if (simIndex >= simString.length) evaluteFinalStep();
        });

        function evaluteFinalStep() {
            if (checkAcceptance()) {
                appendSimLog("End of string. <b>ACCEPTED</b>", "success");
            } else {
                appendSimLog("End of string. <b>REJECTED</b>", "error");
            }
            document.getElementById('btn-sim-next').classList.add('opacity-50');
            document.getElementById('btn-sim-next').disabled = true;
        }

        document.getElementById('btn-sim-stop').addEventListener('click', () => {
            isSimulating = false;
            activeStates.clear();
            updateGraph();
            
            document.getElementById('btn-sim-start-step').classList.remove('hidden');
            document.getElementById('btn-sim-quick').classList.remove('hidden');
            document.getElementById('btn-sim-stop').classList.add('hidden');
            document.getElementById('btn-sim-next').classList.add('hidden');
            
            appendSimLog("Simulation stopped.");
        });

        function showMessage(msg, type="info") {
            const box = document.getElementById('message-box');
            box.innerText = msg;
            
            if(type === 'error') {
                box.className = "px-4 py-1.5 rounded text-white font-medium text-sm transition-opacity duration-300 bg-red-500 opacity-100";
            } else {
                box.className = "px-4 py-1.5 rounded text-white font-medium text-sm transition-opacity duration-300 bg-slate-800 opacity-100";
            }
            
            setTimeout(() => { 
                box.classList.remove('opacity-100'); 
                box.classList.add('opacity-0'); 
            }, 3000);
        }

        updateGraph();
    </script>
</body>
</html>
